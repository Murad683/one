name: Deploy backend to Hetzner

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_one-agency-api.yml'
  workflow_dispatch:

concurrency:
  group: hetzner-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            "$HETZNER_USER@$HETZNER_HOST" 'bash /opt/one-agency/deploy.sh'
